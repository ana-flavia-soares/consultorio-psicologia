name: Verificações

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Toda segunda às 9h (Brasília): pega vulnerabilidades novas em dependências.
    - cron: '0 12 * * 1'

permissions:
  contents: read

jobs:
  app:
    name: App (tipos, criptografia, build, dependências)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Testes de criptografia
        run: npm run test:crypto
      - name: Build
        run: npx vite build
        env:
          VITE_SUPABASE_URL: https://exemplo.supabase.co
          VITE_SUPABASE_ANON_KEY: chave-de-exemplo
      - name: Vulnerabilidades conhecidas nas dependências
        run: npm run audit

  banco:
    name: Banco (regras de segurança)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Testes de RLS, imutabilidade e auditoria
        run: PG_BIN=/usr/lib/postgresql/16/bin bash scripts/test-db.sh
